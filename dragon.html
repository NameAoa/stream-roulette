<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OBS Roulette</title>
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: transparent;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; overflow: hidden;
    }
    .scale-wrap {
      width:440px; opacity:0;
      transition:opacity 0.4s; margin-bottom:8px;
    }
    .scale-wrap.visible { opacity:1; }
    .scale-label {
      color:#fff; font-size:30px;
      font-family:'Poiret One',cursive;
      text-align:center;
      text-shadow:0 0 12px rgba(140,80,200,0.8);
      letter-spacing:2px;
    }

    /* ── Контейнер ── */
    .wheel-outer {
      position:relative;
      width:600px; height:600px;
      opacity:0; transition:opacity 0.5s;
    }
    .wheel-outer.visible { opacity:1; }

    /* ── SVG дракон — статичен, поверх всего ── */
    #dragonSvg {
      position:absolute; top:0; left:0;
      width:600px; height:600px;
      z-index:6; pointer-events:none;
    }

    /* Все drawable — изначально невидимы */
    .drw {
      fill:none;
      stroke:#ddd8cc;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:0;
      stroke-dasharray:var(--L,3000);
      stroke-dashoffset:var(--L,3000);
    }
    .drw.on {
      opacity:1;
      animation:draw var(--d,1.2s) var(--dl,0s) ease both;
    }
    @keyframes draw { to { stroke-dashoffset:0; } }

    /* Глаза */
    .eye-orb {
      fill:#ff2200; stroke:none; opacity:0;
      filter:drop-shadow(0 0 5px #ff3300);
    }
    .eye-orb.on {
      animation:eyePop .35s ease forwards, eyePulse 2.5s .35s ease-in-out infinite alternate;
    }
    @keyframes eyePop {
      0%  {opacity:0;transform:scale(0) translate(0,0);}
      65% {transform:scale(1.3);}
      100%{opacity:1;transform:scale(1);}
    }
    @keyframes eyePulse {
      from{filter:drop-shadow(0 0 3px #ff2200);}
      to  {filter:drop-shadow(0 0 12px #ff6600);}
    }

    /* Idle дыхание всего дракона */
    #dragonSvg.idle {
      animation:breath 3.5s ease-in-out infinite alternate;
    }
    @keyframes breath {
      from{filter:drop-shadow(0 0 4px rgba(200,50,20,.3));}
      to  {filter:drop-shadow(0 0 16px rgba(230,80,30,.65));}
    }

    /* ── Колесо ── */
    .wheel-spin-group {
      position:absolute;
      top:50%; left:50%;
      width:400px; height:400px;
      margin:-200px 0 0 -200px;
      transform-origin:center;
      z-index:2; opacity:0;
      transition:opacity .7s ease;
    }
    .wheel-spin-group.visible { opacity:1; }
    canvas {
      border-radius:50%;
      box-shadow:0 0 55px rgba(140,80,200,.75),0 0 18px rgba(200,80,80,.35);
    }

    /* ── Стрелка ── */
    .arrow-wrap {
      position:absolute;
      top:50%; left:50%;
      margin-top:-218px; margin-left:-18px;
      z-index:10;
      filter:drop-shadow(0 4px 8px rgba(0,0,0,.9));
    }
    .arrow-wrap svg { width:36px; height:52px; }

    #spinResult {
      margin-top:14px; min-height:80px;
      font-size:34px; font-family:'Poiret One',cursive;
      color:#fff; text-shadow:0 0 20px rgba(140,80,200,.9);
      letter-spacing:3px; opacity:0; transition:opacity .5s;
      text-align:center;
    }
    #spinResult.visible { opacity:1; }
  </style>
</head>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyCw4Fr5SrDh67kHtflFSZm7EJ4T5o-neQs",
  authDomain:"roulette-twitch-2c7a3.firebaseapp.com",
  databaseURL:"https://roulette-twitch-2c7a3-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId:"roulette-twitch-2c7a3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const colors=["#3d1a6e","#5a2d91","#7b4fa6","#9d6dbf","#4a2278","#6b3d9e","#8c5ab5","#b07fd4"];
let options=[],goal=150,currentAngle=0,isSpinning=false;
let hideTimer=null,spinQueue=[],processingQueue=false,dragonReady=false;

const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d");
const wheelOuter=document.getElementById("wheelOuter");
const wheelSpin=document.getElementById("wheelSpinGroup");
const dragonSvg=document.getElementById("dragonSvg");
const scaleWrap=document.getElementById("scaleWrap"),scaleLabel=document.getElementById("scaleLabel");
const spinResult=document.getElementById("spinResult");

db.ref("options").on("value",s=>{if(s.val()){options=s.val();drawWheel(currentAngle);}});
db.ref("goal").on("value",s=>{if(s.val())goal=s.val();});

function getArcs(){
  const t=options.reduce((s,o)=>s+(o.weight||1),0);
  return options.map(o=>((o.weight||1)/t)*2*Math.PI);
}
function drawWheel(a){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const cx=canvas.width/2,cy=canvas.height/2,r=cx-5;
  const arcs=getArcs();let sa=a;
  for(let i=0;i<options.length;i++){
    const ea=sa+arcs[i];
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,sa,ea);ctx.closePath();
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,lighten(colors[i%colors.length],50));
    g.addColorStop(1,colors[i%colors.length]);
    ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,0.2)";ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(sa+arcs[i]/2);
    ctx.textAlign="right";ctx.fillStyle="#fff";ctx.font="13px 'Poiret One'";
    ctx.shadowColor="rgba(0,0,0,0.8)";ctx.shadowBlur=5;
    ctx.fillText(options[i].label,r-14,6);ctx.restore();
    sa=ea;
  }
}
function lighten(hex,a){
  const n=parseInt(hex.slice(1),16);
  return`rgb(${Math.min(255,(n>>16)+a)},${Math.min(255,((n>>8)&0xff)+a)},${Math.min(255,(n&0xff)+a)})`;
}

/* Измеряем реальные длины path */
function measurePaths(){
  dragonSvg.querySelectorAll('.drw').forEach(el=>{
    if(el.getTotalLength){
      const L=Math.ceil(el.getTotalLength());
      el.style.setProperty('--L',L);
      el.style.strokeDasharray=L;
      el.style.strokeDashoffset=L;
    }
  });
}

/* ПОЛНОЕ ВРЕМЯ АНИМАЦИИ: последний элемент delay≈9.75s + dur≈0.2s = ~10s */
const ANIM_MS = 10400;

function animateDragon(onDone){
  wheelOuter.classList.add("visible");
  if(dragonReady){wheelSpin.classList.add("visible");onDone();return;}

  /* Сброс */
  dragonSvg.querySelectorAll('.drw').forEach(el=>el.classList.remove('on'));
  document.getElementById('eyeGlow').classList.remove('on');
  document.getElementById('eyePupil').style.opacity='0';
  document.getElementById('eyeAura').style.opacity='0';
  dragonSvg.classList.remove('idle');
  void dragonSvg.offsetWidth; /* reflow */

  measurePaths();

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    dragonSvg.querySelectorAll('.drw').forEach(el=>el.classList.add('on'));
  }));

  /* Глаза появляются ~9.6s */
  setTimeout(()=>{
    document.getElementById('eyeGlow').classList.add('on');
    setTimeout(()=>{
      document.getElementById('eyePupil').style.opacity='1';
      document.getElementById('eyeAura').style.opacity='0.7';
    },350);
  },9600);

  /* Колесо появляется ~6s (тело уже нарисовано) */
  setTimeout(()=>wheelSpin.classList.add("visible"),6000);

  /* Переход в idle-режим */
  setTimeout(()=>{
    dragonSvg.classList.add('idle');
    dragonReady=true;
    onDone();
  },ANIM_MS);
}

function spinTo(index,onDone){
  if(isSpinning)return;
  isSpinning=true;
  if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}
  const arcs=getArcs();
  let ss=0;for(let i=0;i<index;i++)ss+=arcs[i];
  const sm=ss+arcs[index]/2;
  const target=(Math.PI/2)-sm+Math.PI;
  const norm=currentAngle%(2*Math.PI);
  let diff=target-norm;
  while(diff<0)diff+=2*Math.PI;
  while(diff>2*Math.PI)diff-=2*Math.PI;
  const final=currentAngle+diff+(6+Math.floor(Math.random()*3))*2*Math.PI;
  const dur=4500,t0=performance.now(),a0=currentAngle;
  function ani(now){
    const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,4);
    currentAngle=a0+(final-a0)*e;
    wheelSpin.style.transform=`rotate(${currentAngle}rad)`;
    drawWheel(currentAngle);
    if(p<1){requestAnimationFrame(ani);return;}
    isSpinning=false;
    db.ref("history").push({value:options[index].label,time:Date.now()});
    spinResult.innerText=options[index].label;
    spinResult.classList.add("visible");
    hideTimer=setTimeout(()=>{
      wheelOuter.classList.remove("visible");
      wheelSpin.classList.remove("visible");
      spinResult.classList.remove("visible");
      dragonReady=false;
      dragonSvg.classList.remove('idle');
      dragonSvg.querySelectorAll('.drw').forEach(el=>el.classList.remove('on'));
      document.getElementById('eyeGlow').classList.remove('on');
      document.getElementById('eyePupil').style.opacity='0';
      document.getElementById('eyeAura').style.opacity='0';
      wheelSpin.style.transform='';
      currentAngle=0;drawWheel(0);
      if(onDone)onDone();
    },6000);
  }
  requestAnimationFrame(ani);
}

function processQueue(){
  if(processingQueue||spinQueue.length===0)return;
  processingQueue=true;
  const idx=spinQueue.shift();
  animateDragon(()=>{
    spinTo(idx,()=>{
      processingQueue=false;
      if(spinQueue.length>0)setTimeout(processQueue,500);
    });
  });
}

drawWheel(0);

let lastTs=0;
db.ref("spinCommand").on("value",snap=>{
  const d=snap.val();
  if(!d||d.ts===lastTs)return;
  lastTs=d.ts;
  const idx=options.findIndex(o=>o.label===d.label);
  if(idx!==-1)setTimeout(()=>{spinQueue.push(idx);processQueue();},isSpinning?0:10000);
});

db.ref("donateTotal").on("value",snap=>{
  const total=snap.val()||0;
  scaleLabel.innerText=`Колесо ${total}/${goal}`;
  scaleWrap.classList.add("visible");
});
</script>
