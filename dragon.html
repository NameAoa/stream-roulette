<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OBS Roulette</title>
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .scale-wrap {
      width: 420px;
      opacity: 0;
      transition: opacity 0.4s;
      margin-bottom: 10px;
    }
    .scale-wrap.visible { opacity: 1; }
    .scale-label {
      color: #fff;
      font-size: 32px;
      font-family: 'Poiret One', cursive;
      text-align: center;
      text-shadow: 0 0 12px rgba(140,80,200,0.8);
      letter-spacing: 2px;
    }

    .wheel-outer {
      position: relative;
      width: 580px;
      height: 580px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .wheel-outer.visible { opacity: 1; }

    /* Дракон PNG — mix-blend-mode:screen убирает чёрный фон */
    .dragon-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      mix-blend-mode: screen;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.6) rotate(-20deg);
    }

    .dragon-img.phase1 {
      animation: dragonAppear 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes dragonAppear {
      0%   { opacity: 0; transform: scale(0.5) rotate(-30deg);
             filter: drop-shadow(0 0 0px transparent) brightness(0); }
      30%  { opacity: 0.5; }
      70%  { transform: scale(1.05) rotate(4deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg);
             filter: drop-shadow(0 0 12px rgba(200,60,60,0.8))
                     drop-shadow(0 0 30px rgba(160,40,40,0.5)); }
    }

    .dragon-img.phase2 {
      opacity: 1;
      transform: scale(1) rotate(0deg);
      animation: dragonBreath 3s ease-in-out infinite alternate;
    }
    @keyframes dragonBreath {
      from { filter: drop-shadow(0 0 8px rgba(200,60,60,0.6))
                     drop-shadow(0 0 20px rgba(160,40,40,0.3)); }
      to   { filter: drop-shadow(0 0 18px rgba(230,80,80,1))
                     drop-shadow(0 0 45px rgba(180,40,40,0.7)); }
    }

    /* Только колесо вращается */
    .wheel-spin-group {
      position: absolute;
      top: 50%; left: 50%;
      width: 380px; height: 380px;
      margin-top: -190px;
      margin-left: -190px;
      transform-origin: center center;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .wheel-spin-group.visible { opacity: 1; }

    canvas {
      border-radius: 50%;
      box-shadow:
        0 0 50px rgba(140,80,200,0.8),
        0 0 15px rgba(200,80,80,0.4);
    }

    /* Стрелка — статичная */
    .arrow-wrap {
      position: absolute;
      top: 50%; left: 50%;
      margin-top: -207px;
      margin-left: -18px;
      z-index: 10;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.9));
    }
    .arrow-wrap svg { width: 36px; height: 52px; }

    #spinResult {
      margin-top: 14px;
      min-height: 80px;
      font-size: 34px;
      font-family: 'Poiret One', cursive;
      color: #fff;
      text-shadow: 0 0 20px rgba(140,80,200,0.9);
      letter-spacing: 3px;
      opacity: 0;
      transition: opacity 0.5s;
      text-align: center;
    }
    #spinResult.visible { opacity: 1; }
  </style>
</head>
<body>

<div class="scale-wrap" id="scaleWrap">
  <div class="scale-label" id="scaleLabel">Колесо 0/150</div>
</div>

<div class="wheel-outer" id="wheelOuter">

  <!-- Твой дракон PNG. Положи dragon.png рядом с spin.html -->
  <!-- Если хостишь на GitHub Pages — укажи правильный путь -->
  <img
    id="dragonImg"
    class="dragon-img"
    src="dragon.png"
    alt=""
  />

  <!-- Колесо (вращается) -->
  <div class="wheel-spin-group" id="wheelSpinGroup">
    <canvas id="wheel" width="380" height="380"></canvas>
  </div>

  <!-- Стрелка -->
  <div class="arrow-wrap">
    <svg viewBox="0 0 36 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   style="stop-color:#666"/>
          <stop offset="30%"  style="stop-color:#ddd"/>
          <stop offset="60%"  style="stop-color:#aaa"/>
          <stop offset="100%" style="stop-color:#555"/>
        </linearGradient>
      </defs>
      <polygon points="18,52 0,4 36,4" fill="url(#metalGrad)"/>
      <rect x="6" y="0" width="24" height="8" rx="2" fill="url(#metalGrad)" stroke="#333" stroke-width="1"/>
    </svg>
  </div>

</div>

<div id="spinResult"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCw4Fr5SrDh67kHtflFSZm7EJ4T5o-neQs",
  authDomain: "roulette-twitch-2c7a3.firebaseapp.com",
  databaseURL: "https://roulette-twitch-2c7a3-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "roulette-twitch-2c7a3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const colors = [
  "#3d1a6e","#5a2d91","#7b4fa6","#9d6dbf",
  "#4a2278","#6b3d9e","#8c5ab5","#b07fd4"
];

let options = [], goal = 150;
let currentAngle = 0, isSpinning = false;
let hideTimer = null, spinQueue = [], processingQueue = false;
let dragonReady = false;

const canvas     = document.getElementById("wheel");
const ctx        = canvas.getContext("2d");
const wheelOuter = document.getElementById("wheelOuter");
const wheelSpin  = document.getElementById("wheelSpinGroup");
const dragonImg  = document.getElementById("dragonImg");
const scaleWrap  = document.getElementById("scaleWrap");
const scaleLabel = document.getElementById("scaleLabel");
const spinResult = document.getElementById("spinResult");

db.ref("options").on("value", snap => {
  if (snap.val()) { options = snap.val(); drawWheel(currentAngle); }
});
db.ref("goal").on("value", snap => { if (snap.val()) goal = snap.val(); });

function getArcs() {
  const t = options.reduce((s,o) => s+(o.weight||1), 0);
  return options.map(o => ((o.weight||1)/t)*2*Math.PI);
}

function drawWheel(angle) {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const cx=canvas.width/2, cy=canvas.height/2, r=cx-5;
  const arcs=getArcs(); let sa=angle;
  for(let i=0;i<options.length;i++){
    const ea=sa+arcs[i];
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,sa,ea); ctx.closePath();
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,lighten(colors[i%colors.length],50));
    g.addColorStop(1,colors[i%colors.length]);
    ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,0.2)"; ctx.lineWidth=2; ctx.stroke();
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(sa+arcs[i]/2);
    ctx.textAlign="right"; ctx.fillStyle="#fff"; ctx.font="13px 'Poiret One'";
    ctx.shadowColor="rgba(0,0,0,0.8)"; ctx.shadowBlur=5;
    ctx.fillText(options[i].label,r-14,6); ctx.restore();
    sa=ea;
  }
}

function lighten(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgb(${Math.min(255,(n>>16)+a)},${Math.min(255,((n>>8)&0xff)+a)},${Math.min(255,(n&0xff)+a)})`;
}

function animateDragon(onDone) {
  wheelOuter.classList.add("visible");

  if (dragonReady) {
    wheelSpin.classList.add("visible");
    onDone(); return;
  }

  // Убираем старые классы, форсируем reflow
  dragonImg.classList.remove("phase1","phase2");
  dragonImg.style.opacity = "0";
  void dragonImg.offsetWidth; // reflow

  dragonImg.classList.add("phase1");

  setTimeout(() => { wheelSpin.classList.add("visible"); }, 1500);

  setTimeout(() => {
    dragonImg.classList.remove("phase1");
    dragonImg.classList.add("phase2");
    dragonReady = true;
    onDone();
  }, 2200);
}

function spinTo(index, onDone) {
  if(isSpinning) return;
  isSpinning=true;
  if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}

  const arcs=getArcs();
  let ss=0; for(let i=0;i<index;i++) ss+=arcs[i];
  const sm=ss+arcs[index]/2;
  const target=(Math.PI/2)-sm+Math.PI;
  const norm=currentAngle%(2*Math.PI);
  let diff=target-norm;
  while(diff<0) diff+=2*Math.PI;
  while(diff>2*Math.PI) diff-=2*Math.PI;

  const finalAngle=currentAngle+diff+(6+Math.floor(Math.random()*3))*2*Math.PI;
  const dur=4500, t0=performance.now(), a0=currentAngle;

  function animate(now){
    const p=Math.min((now-t0)/dur,1);
    const e=1-Math.pow(1-p,4);
    currentAngle=a0+(finalAngle-a0)*e;
    wheelSpin.style.transform=`rotate(${currentAngle}rad)`;
    drawWheel(currentAngle);
    if(p<1){ requestAnimationFrame(animate); return; }

    isSpinning=false;
    db.ref("history").push({value:options[index].label,time:Date.now()});
    spinResult.innerText=options[index].label;
    spinResult.classList.add("visible");

    hideTimer=setTimeout(()=>{
      wheelOuter.classList.remove("visible");
      wheelSpin.classList.remove("visible");
      spinResult.classList.remove("visible");
      dragonReady=false;
      dragonImg.classList.remove("phase1","phase2");
      dragonImg.style.opacity="0";
      dragonImg.style.transform="scale(0.6) rotate(-20deg)";
      wheelSpin.style.transform="";
      currentAngle=0; drawWheel(0);
      if(onDone) onDone();
    },6000);
  }
  requestAnimationFrame(animate);
}

function processQueue(){
  if(processingQueue||spinQueue.length===0) return;
  processingQueue=true;
  const idx=spinQueue.shift();
  animateDragon(()=>{
    spinTo(idx,()=>{
      processingQueue=false;
      if(spinQueue.length>0) setTimeout(processQueue,500);
    });
  });
}

drawWheel(0);

let lastTs=0;
db.ref("spinCommand").on("value",snap=>{
  const data=snap.val();
  if(!data||data.ts===lastTs) return;
  lastTs=data.ts;
  const idx=options.findIndex(o=>o.label===data.label);
  if(idx!==-1) setTimeout(()=>{spinQueue.push(idx);processQueue();},isSpinning?0:10000);
});

db.ref("donateTotal").on("value",snap=>{
  const total=snap.val()||0;
  scaleLabel.innerText=`Колесо ${total}/${goal}`;
  scaleWrap.classList.add("visible");
});
</script>
</body>
</html>
