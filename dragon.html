<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OBS Roulette</title>
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; overflow: hidden;
    }

    .scale-wrap {
      width: 420px; opacity: 0;
      transition: opacity 0.4s; margin-bottom: 8px;
    }
    .scale-wrap.visible { opacity: 1; }
    .scale-label {
      color: #fff; font-size: 32px;
      font-family: 'Poiret One', cursive;
      text-align: center;
      text-shadow: 0 0 12px rgba(140,80,200,0.8);
      letter-spacing: 2px;
    }

    /* Outer wrapper — никогда не вращается */
    .wheel-outer {
      position: relative;
      width: 560px; height: 560px;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .wheel-outer.visible { opacity: 1; }

    /* SVG дракон — поверх всего, статичен */
    .dragon-svg {
      position: absolute;
      top: 0; left: 0;
      width: 560px; height: 560px;
      z-index: 6;
      pointer-events: none;
    }

    /* Все path по умолчанию невидимы */
    .dragon-svg path,
    .dragon-svg ellipse,
    .dragon-svg circle,
    .dragon-svg polyline,
    .dragon-svg polygon {
      fill: none;
      stroke: #e8e0d0;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
    }

    /* Класс .drawn добавляется JS-ом поочерёдно */
    .dragon-svg .drawable {
      stroke-dasharray: var(--len, 2000);
      stroke-dashoffset: var(--len, 2000);
    }
    .dragon-svg .drawable.drawn {
      animation: drawStroke var(--dur, 1s) var(--delay, 0s) ease forwards;
      opacity: 1;
    }
    @keyframes drawStroke {
      to { stroke-dashoffset: 0; }
    }

    /* Глаза светятся сразу после прорисовки головы */
    .dragon-svg .eye-glow {
      fill: #ff3300;
      stroke: none;
      opacity: 0;
      filter: drop-shadow(0 0 4px #ff2200);
    }
    .dragon-svg .eye-glow.lit {
      animation: eyePop 0.3s ease forwards, eyePulse 2s 0.3s ease-in-out infinite alternate;
    }
    @keyframes eyePop {
      0%  { opacity: 0; transform: scale(0); }
      60% { transform: scale(1.4); }
      100%{ opacity: 1; transform: scale(1); }
    }
    @keyframes eyePulse {
      from { filter: drop-shadow(0 0 3px #ff2200); }
      to   { filter: drop-shadow(0 0 10px #ff5500); }
    }

    /* Дыхание дракона — idle glow на теле */
    .dragon-svg.breathing {
      filter: drop-shadow(0 0 6px rgba(220,80,50,0.4));
      animation: dragonBreath 3s ease-in-out infinite alternate;
    }
    @keyframes dragonBreath {
      from { filter: drop-shadow(0 0 5px rgba(220,80,50,0.3)); }
      to   { filter: drop-shadow(0 0 18px rgba(230,100,50,0.7)); }
    }

    /* Колесо */
    .wheel-spin-group {
      position: absolute;
      top: 50%; left: 50%;
      width: 380px; height: 380px;
      margin-top: -190px; margin-left: -190px;
      transform-origin: center center;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.7s ease;
    }
    .wheel-spin-group.visible { opacity: 1; }

    canvas {
      border-radius: 50%;
      box-shadow: 0 0 50px rgba(140,80,200,0.7), 0 0 15px rgba(200,80,80,0.3);
    }

    /* Стрелка */
    .arrow-wrap {
      position: absolute;
      top: 50%; left: 50%;
      margin-top: -207px; margin-left: -18px;
      z-index: 10;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.9));
    }
    .arrow-wrap svg { width: 36px; height: 52px; }

    #spinResult {
      margin-top: 14px; min-height: 80px;
      font-size: 34px; font-family: 'Poiret One', cursive;
      color: #fff; text-shadow: 0 0 20px rgba(140,80,200,0.9);
      letter-spacing: 3px; opacity: 0; transition: opacity 0.5s;
      text-align: center;
    }
    #spinResult.visible { opacity: 1; }
  </style>
</head>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
/* ── Firebase ── */
const firebaseConfig = {
  apiKey: "AIzaSyCw4Fr5SrDh67kHtflFSZm7EJ4T5o-neQs",
  authDomain: "roulette-twitch-2c7a3.firebaseapp.com",
  databaseURL: "https://roulette-twitch-2c7a3-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "roulette-twitch-2c7a3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ── Палитра ── */
const colors = [
  "#3d1a6e","#5a2d91","#7b4fa6","#9d6dbf",
  "#4a2278","#6b3d9e","#8c5ab5","#b07fd4"
];

/* ── Состояние ── */
let options = [], goal = 150;
let currentAngle = 0, isSpinning = false;
let hideTimer = null, spinQueue = [], processingQueue = false;
let dragonReady = false;

/* ── DOM ── */
const canvas      = document.getElementById("wheel");
const ctx         = canvas.getContext("2d");
const wheelOuter  = document.getElementById("wheelOuter");
const wheelSpin   = document.getElementById("wheelSpinGroup");
const dragonSvg   = document.getElementById("dragonSvg");
const scaleWrap   = document.getElementById("scaleWrap");
const scaleLabel  = document.getElementById("scaleLabel");
const spinResult  = document.getElementById("spinResult");

/* ── Firebase listeners ── */
db.ref("options").on("value", snap => {
  if (snap.val()) { options = snap.val(); drawWheel(currentAngle); }
});
db.ref("goal").on("value", snap => { if (snap.val()) goal = snap.val(); });

/* ── Рисуем колесо ── */
function getArcs() {
  const t = options.reduce((s,o) => s+(o.weight||1), 0);
  return options.map(o => ((o.weight||1)/t)*2*Math.PI);
}
function drawWheel(angle) {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const cx=canvas.width/2, cy=canvas.height/2, r=cx-5;
  const arcs=getArcs(); let sa=angle;
  for(let i=0;i<options.length;i++){
    const ea=sa+arcs[i];
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,sa,ea); ctx.closePath();
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,lighten(colors[i%colors.length],50));
    g.addColorStop(1,colors[i%colors.length]);
    ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,0.2)"; ctx.lineWidth=2; ctx.stroke();
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(sa+arcs[i]/2);
    ctx.textAlign="right"; ctx.fillStyle="#fff"; ctx.font="13px 'Poiret One'";
    ctx.shadowColor="rgba(0,0,0,0.8)"; ctx.shadowBlur=5;
    ctx.fillText(options[i].label,r-14,6); ctx.restore();
    sa=ea;
  }
}
function lighten(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgb(${Math.min(255,(n>>16)+a)},${Math.min(255,((n>>8)&0xff)+a)},${Math.min(255,(n&0xff)+a)})`;
}

/* ── Измеряем длины path для dasharray ── */
function measureAndSetPaths() {
  const paths = dragonSvg.querySelectorAll('.drawable');
  paths.forEach(el => {
    const len = el.getTotalLength ? el.getTotalLength() : 800;
    el.style.setProperty('--len', Math.ceil(len));
    el.style.strokeDasharray = Math.ceil(len);
    el.style.strokeDashoffset = Math.ceil(len);
  });
}

/* ── Анимация дракона ── */
// Полное время анимации ~10 сек (последний элемент delay 9.7s + 0.4s)
const DRAGON_ANIM_TOTAL = 10200; // мс

function animateDragon(onDone) {
  wheelOuter.classList.add("visible");

  if (dragonReady) {
    wheelSpin.classList.add("visible");
    onDone(); return;
  }

  // Форсируем reflow и запускаем анимацию
  dragonSvg.querySelectorAll('.drawable').forEach(el => {
    el.classList.remove('drawn');
    void el.offsetWidth;
  });
  document.getElementById('eye1').classList.remove('lit');
  document.getElementById('eye2').classList.remove('lit');

  measureAndSetPaths();

  // Запускаем прорисовку через tiny timeout (нужен для reflow)
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      dragonSvg.querySelectorAll('.drawable').forEach(el => {
        el.classList.add('drawn');
      });
    });
  });

  // Глаза загораются около 9.5s
  setTimeout(() => {
    document.getElementById('eye1').classList.add('lit');
    document.getElementById('eye2').style.opacity = '1';
  }, 9200);

  // Колесо появляется раньше (~6.5s, когда тело уже нарисовано)
  setTimeout(() => {
    wheelSpin.classList.add("visible");
  }, 6500);

  // Переходим в режим дыхания
  setTimeout(() => {
    dragonSvg.classList.add('breathing');
    dragonReady = true;
    onDone();
  }, DRAGON_ANIM_TOTAL);
}

/* ── Спин ── */
function spinTo(index, onDone) {
  if(isSpinning) return;
  isSpinning = true;
  if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}

  const arcs=getArcs();
  let ss=0; for(let i=0;i<index;i++) ss+=arcs[i];
  const sm=ss+arcs[index]/2;
  const target=(Math.PI/2)-sm+Math.PI;
  const norm=currentAngle%(2*Math.PI);
  let diff=target-norm;
  while(diff<0) diff+=2*Math.PI;
  while(diff>2*Math.PI) diff-=2*Math.PI;

  const finalAngle=currentAngle+diff+(6+Math.floor(Math.random()*3))*2*Math.PI;
  const dur=4500, t0=performance.now(), a0=currentAngle;

  function animate(now){
    const p=Math.min((now-t0)/dur,1);
    const e=1-Math.pow(1-p,4);
    currentAngle=a0+(finalAngle-a0)*e;
    wheelSpin.style.transform=`rotate(${currentAngle}rad)`;
    drawWheel(currentAngle);
    if(p<1){ requestAnimationFrame(animate); return; }

    isSpinning=false;
    db.ref("history").push({value:options[index].label,time:Date.now()});
    spinResult.innerText=options[index].label;
    spinResult.classList.add("visible");

    hideTimer=setTimeout(()=>{
      // Прячем
      wheelOuter.classList.remove("visible");
      wheelSpin.classList.remove("visible");
      spinResult.classList.remove("visible");
      // Сброс дракона
      dragonReady=false;
      dragonSvg.classList.remove('breathing');
      dragonSvg.querySelectorAll('.drawable').forEach(el=>{
        el.classList.remove('drawn');
        el.style.opacity='0';
      });
      document.getElementById('eye1').classList.remove('lit');
      document.getElementById('eye2').style.opacity='0';
      wheelSpin.style.transform='';
      currentAngle=0; drawWheel(0);
      if(onDone) onDone();
    }, 6000);
  }
  requestAnimationFrame(animate);
}

/* ── Очередь ── */
function processQueue(){
  if(processingQueue||spinQueue.length===0) return;
  processingQueue=true;
  const idx=spinQueue.shift();
  animateDragon(()=>{
    spinTo(idx,()=>{
      processingQueue=false;
      if(spinQueue.length>0) setTimeout(processQueue,500);
    });
  });
}

drawWheel(0);

/* ── Firebase команды ── */
let lastTs=0;
db.ref("spinCommand").on("value",snap=>{
  const data=snap.val();
  if(!data||data.ts===lastTs) return;
  lastTs=data.ts;
  const idx=options.findIndex(o=>o.label===data.label);
  if(idx!==-1) setTimeout(()=>{spinQueue.push(idx);processQueue();},isSpinning?0:10000);
});

db.ref("donateTotal").on("value",snap=>{
  const total=snap.val()||0;
  scaleLabel.innerText=`Колесо ${total}/${goal}`;
  scaleWrap.classList.add("visible");
});
</script>
