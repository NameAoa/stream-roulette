<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OBS Roulette</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; overflow: hidden;
      font-family: 'Cinzel', serif;
    }

    /* ── Scale label ── */
    .scale-wrap {
      width: 380px; opacity: 0;
      transition: opacity 0.4s; margin-bottom: 12px;
    }
    .scale-wrap.visible { opacity: 1; }
    .scale-label {
      color: #8b0000;
      font-size: 28px;
      font-family: 'Cinzel Decorative', serif;
      text-align: center;
      text-shadow: 0 0 16px rgba(139,0,0,0.7);
      letter-spacing: 3px;
    }

    /* ── Main stage ── */
    #stage {
      position: relative;
      width: 460px; height: 460px;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Intro polygon (SVG) ── */
    #introSvg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
    }
    #introSvg polygon {
      fill: none;
      stroke: #8b0000;
      stroke-width: 3;
    }

    /* ── Canvas wheel ── */
    #wheelCanvas {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      z-index: 5;
    }

    /* ── SVG overlay for sector symbols ── */
    #symbolsSvg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 6;
      opacity: 0;
    }

    /* ── Arrow ── */
    .arrow-wrap {
      position: absolute;
      top: -4px; left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      filter: drop-shadow(0 4px 10px rgba(139,0,0,0.9));
      opacity: 0;
      transition: opacity 0.4s;
    }
    .arrow-wrap.visible { opacity: 1; }
    .arrow-wrap svg { width: 36px; height: 52px; }

    /* ── Result display ── */
    #resultOverlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 100;
      opacity: 0;
    }
    #resultOverlay.visible { opacity: 1; }

    #winnerSymbol {
      width: 220px; height: 220px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    #winnerSymbolSvg {
      width: 100%; height: 100%;
    }
    #winnerLabel {
      color: #fff;
      font-family: 'Cinzel Decorative', serif;
      font-size: 28px;
      text-align: center;
      text-shadow: 0 0 20px rgba(139,0,0,1), 0 0 40px rgba(139,0,0,0.6);
      letter-spacing: 3px;
      margin-top: 20px;
      max-width: 400px;
      opacity: 0;
    }
  </style>
</head>
<body>

<div class="scale-wrap" id="scaleWrap">
  <div class="scale-label" id="scaleLabel">Колесо 0/150</div>
</div>

<div id="stage">
  <!-- Intro animation polygon -->
  <svg id="introSvg" viewBox="0 0 460 460" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="turbFilter" x="-50%" y="-50%" width="200%" height="200%">
        <feTurbulence id="feTurb" type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise"/>
        <feDisplacementMap id="feDisp" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <radialGradient id="polyGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff2020" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#8b0000" stop-opacity="0.6"/>
      </radialGradient>
    </defs>
    <!-- Start as a point in the center, morphs to polygon -->
    <polygon id="introPoly"
      points="230 230, 230 230, 230 230"
      fill="url(#polyGrad)"
      stroke="#8b0000"
      stroke-width="3"
      filter="url(#turbFilter)"
    />
    <circle id="introGlow" cx="230" cy="230" r="0" fill="none" stroke="#8b0000" stroke-width="2" opacity="0.5"/>
  </svg>

  <canvas id="wheelCanvas" width="420" height="420"></canvas>

  <svg id="symbolsSvg" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" style="width:420px;height:420px;"></svg>

  <div class="arrow-wrap" id="arrowWrap">
    <svg viewBox="0 0 36 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#5a0000"/>
          <stop offset="30%" style="stop-color:#cc0000"/>
          <stop offset="60%" style="stop-color:#990000"/>
          <stop offset="100%" style="stop-color:#3a0000"/>
        </linearGradient>
      </defs>
      <polygon points="18,52 0,4 36,4" fill="url(#metalGrad)"/>
      <rect x="6" y="0" width="24" height="8" rx="2" fill="url(#metalGrad)" stroke="#3a0000" stroke-width="1"/>
    </svg>
  </div>
</div>

<!-- Winner overlay -->
<div id="resultOverlay">
  <div id="winnerSymbol">
    <svg id="winnerSymbolSvg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div id="winnerLabel"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
// ─────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCw4Fr5SrDh67kHtflFSZm7EJ4T5o-neQs",
  authDomain: "roulette-twitch-2c7a3.firebaseapp.com",
  databaseURL: "https://roulette-twitch-2c7a3-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "roulette-twitch-2c7a3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ─────────────────────────────────────────────
// CATEGORIES & SYMBOLS
// 0=circle, 1=diamond, 2=square, 3=triangle, 4=heart
// ─────────────────────────────────────────────
const CATEGORIES = ['circle', 'diamond', 'square', 'triangle', 'heart'];

// Draw a symbol into SVG context at center cx,cy with size r
function symbolPath(type, cx, cy, r) {
  switch(type) {
    case 'circle':
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#8b0000" stroke-width="3"/>`;
    case 'diamond': {
      const pts = [
        `${cx},${cy - r}`,
        `${cx + r},${cy}`,
        `${cx},${cy + r}`,
        `${cx - r},${cy}`
      ].join(' ');
      return `<polygon points="${pts}" fill="none" stroke="#8b0000" stroke-width="3"/>`;
    }
    case 'square': {
      const h = r * 0.82;
      return `<rect x="${cx-h}" y="${cy-h}" width="${h*2}" height="${h*2}" fill="none" stroke="#8b0000" stroke-width="3"/>`;
    }
    case 'triangle': {
      const pts = [
        `${cx},${cy - r}`,
        `${cx + r * 0.866},${cy + r * 0.5}`,
        `${cx - r * 0.866},${cy + r * 0.5}`
      ].join(' ');
      return `<polygon points="${pts}" fill="none" stroke="#8b0000" stroke-width="3"/>`;
    }
    case 'heart': {
      // Heart path centered at cx,cy sized ~r
      const s = r / 50;
      const tx = cx - 50 * s;
      const ty = cy - 45 * s;
      return `<path transform="translate(${tx},${ty}) scale(${s})"
        d="M50 85 C30 65, 0 50, 0 30 C0 13 13 0 30 0 C39 0 47 4 50 10 C53 4 61 0 70 0 C87 0 100 13 100 30 C100 50 70 65 50 85Z"
        fill="none" stroke="#8b0000" stroke-width="${3/s}"/>`;
    }
  }
  return '';
}

// Assign category based on option index (cycles through 5)
function getCategory(index) {
  return CATEGORIES[index % CATEGORIES.length];
}

// ─────────────────────────────────────────────
// WHEEL COLORS — BLACK & DARK RED
// ─────────────────────────────────────────────
const WHEEL_COLORS = [
  '#111111',
  '#1a0000',
  '#0d0d0d',
  '#200000',
  '#141414',
  '#180000',
  '#0a0a0a',
  '#1e0000',
];

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let options = [];
let goal = 150;
let currentAngle = 0;
let isSpinning = false;
let hideTimer = null;
let spinQueue = [];
let processingQueue = false;
let lastTs = 0;

const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const symbolsSvg = document.getElementById('symbolsSvg');
const arrowWrap = document.getElementById('arrowWrap');
const scaleWrap = document.getElementById('scaleWrap');
const scaleLabel = document.getElementById('scaleLabel');
const resultOverlay = document.getElementById('resultOverlay');
const winnerSymbolSvg = document.getElementById('winnerSymbolSvg');
const winnerLabel = document.getElementById('winnerLabel');
const introSvg = document.getElementById('introSvg');
const introPoly = document.getElementById('introPoly');
const introGlow = document.getElementById('introGlow');
const feTurb = document.getElementById('feTurb');
const feDisp = document.getElementById('feDisp');

// ─────────────────────────────────────────────
// FIREBASE LISTENERS
// ─────────────────────────────────────────────
db.ref("options").on("value", snap => {
  if (snap.val()) {
    options = snap.val();
    drawWheel(currentAngle);
  }
});
db.ref("goal").on("value", snap => {
  if (snap.val()) goal = snap.val();
});
db.ref("donateTotal").on("value", snap => {
  const total = snap.val() || 0;
  scaleLabel.innerText = `Колесо ${total}/${goal}`;
  scaleWrap.classList.add("visible");
});
db.ref("spinCommand").on("value", snap => {
  const data = snap.val();
  if (!data || data.ts === lastTs) return;
  lastTs = data.ts;
  const index = options.findIndex(o => o.label === data.label);
  if (index !== -1) {
    setTimeout(() => {
      spinQueue.push(index);
      processQueue();
    }, isSpinning ? 0 : 10000);
  }
});

// ─────────────────────────────────────────────
// ARC HELPERS
// ─────────────────────────────────────────────
function getArcs() {
  const total = options.reduce((s, o) => s + (o.weight || 1), 0);
  return options.map(o => ((o.weight || 1) / total) * 2 * Math.PI);
}

// ─────────────────────────────────────────────
// DRAW WHEEL ON CANVAS
// ─────────────────────────────────────────────
function drawWheel(angle) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!options.length) return;

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = cx - 4;
  const arcs = getArcs();
  let startA = angle;

  // outer border ring
  ctx.beginPath();
  ctx.arc(cx, cy, radius + 3, 0, Math.PI * 2);
  ctx.strokeStyle = '#8b0000';
  ctx.lineWidth = 5;
  ctx.stroke();

  for (let i = 0; i < options.length; i++) {
    const endA = startA + arcs[i];

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startA, endA);
    ctx.closePath();
    ctx.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length];
    ctx.fill();
    ctx.strokeStyle = '#8b0000';
    ctx.lineWidth = 2;
    ctx.stroke();

    // label text
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startA + arcs[i] / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#cc0000';
    ctx.font = "bold 13px 'Cinzel', serif";
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 6;
    ctx.fillText(options[i].label, radius - 34, 5);
    ctx.restore();

    startA = endA;
  }

  // center cap
  ctx.beginPath();
  ctx.arc(cx, cy, 18, 0, Math.PI * 2);
  ctx.fillStyle = '#0a0a0a';
  ctx.fill();
  ctx.strokeStyle = '#8b0000';
  ctx.lineWidth = 3;
  ctx.stroke();
}

// ─────────────────────────────────────────────
// DRAW SYMBOLS SVG OVERLAY
// ─────────────────────────────────────────────
function buildSymbolsSvg(angle) {
  if (!options.length) return;
  const cx = 210, cy = 210, radius = 206;
  const arcs = getArcs();
  let startA = angle;

  let html = '';
  for (let i = 0; i < options.length; i++) {
    const midA = startA + arcs[i] / 2;
    const sr = radius * 0.72; // symbol radial distance
    const sx = cx + Math.cos(midA) * sr;
    const sy = cy + Math.sin(midA) * sr;
    const cat = getCategory(i);
    html += `<g class="sector-sym" opacity="0" data-idx="${i}">${symbolPath(cat, sx, sy, 14)}</g>`;
    startA += arcs[i];
  }
  symbolsSvg.innerHTML = html;
}

// ─────────────────────────────────────────────
// EASING
// ─────────────────────────────────────────────
function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

function lerp(a, b, t) { return a + (b - a) * t; }

// ─────────────────────────────────────────────
// TURBULENCE ANIMATION (JS, no anime.js dependency)
// ─────────────────────────────────────────────
let turbRaf = null;
let turbStart = null;

function startTurbulence() {
  turbStart = performance.now();
  function tick(now) {
    const t = ((now - turbStart) / 1200) % 2; // 0..2, ping-pong
    const p = t < 1 ? t : 2 - t; // 0..1..0
    feTurb.setAttribute('baseFrequency', lerp(0.01, 0.06, p));
    feDisp.setAttribute('scale', lerp(0, 20, p));
    turbRaf = requestAnimationFrame(tick);
  }
  turbRaf = requestAnimationFrame(tick);
}
function stopTurbulence() {
  if (turbRaf) cancelAnimationFrame(turbRaf);
  turbRaf = null;
  feTurb.setAttribute('baseFrequency', '0.01');
  feDisp.setAttribute('scale', '0');
}

// ─────────────────────────────────────────────
// POLYGON → CIRCLE MORPH
// ─────────────────────────────────────────────
function polygonPoints(n, cx, cy, r, rotation) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rotation;
    pts.push(`${cx + Math.cos(a)*r} ${cy + Math.sin(a)*r}`);
  }
  return pts.join(', ');
}

function circleApproxPoints(n, cx, cy, r) {
  // approximate circle with n points
  return polygonPoints(n, cx, cy, r, -Math.PI / 2);
}

// ─────────────────────────────────────────────
// MAIN INTRO ANIMATION SEQUENCE
// ─────────────────────────────────────────────
function runIntroThenWheel(onDone) {
  // Phase 1: polygon pops in with turbulence (0 → 700ms)
  // Phase 2: polygon morphs to circle (700ms → 1400ms)
  // Phase 3: circle shrinks/fades, wheel canvas + symbols fade in (1400ms → 2400ms)
  //          sectors appear one by one clockwise, symbol per sector

  introSvg.style.opacity = '1';
  drawWheel(currentAngle);

  const cx = 230, cy = 230;
  const nPts = 6; // hexagon → circle

  startTurbulence();

  // Phase 1: burst polygon outward
  const P1_DUR = 700;
  const p1Start = performance.now();

  function phase1(now) {
    const t = Math.min((now - p1Start) / P1_DUR, 1);
    const ease = easeOutQuart(t);
    const r = ease * 200;
    introPoly.setAttribute('points', polygonPoints(nPts, cx, cy, r, -Math.PI/2));
    introGlow.setAttribute('r', r * 1.1);
    introGlow.setAttribute('opacity', (1 - ease) * 0.6);

    if (t < 1) { requestAnimationFrame(phase1); }
    else { setTimeout(phase2, 0); }
  }
  requestAnimationFrame(phase1);

  // Phase 2: morph polygon → circle
  const P2_DUR = 700;
  let p2Start = null;
  const polyR = 200;

  function phase2() {
    p2Start = performance.now();
    function tick(now) {
      const t = Math.min((now - p2Start) / P2_DUR, 1);
      const ease = easeInOutCubic(t);
      // morph: interpolate each point between polygon and circle positions
      const polyPts = [];
      for (let i = 0; i < nPts; i++) {
        const pa = (i / nPts) * Math.PI * 2 - Math.PI/2;
        const ca = (i / nPts) * Math.PI * 2 - Math.PI/2; // same
        const pr = polyR;
        const cr = polyR;
        const ang = pa; // same angle
        // actual morph: poly has pointy vertexes, circle is smooth
        // We approximate by increasing effective points from 6 to 60
        const nEff = Math.round(lerp(nPts, 60, ease));
        if (i === 0) {
          // rebuild all points
          const newPts = circleApproxPoints(nEff, cx, cy, polyR);
          introPoly.setAttribute('points', newPts);
        }
      }
      if (t < 1) { requestAnimationFrame(tick); }
      else {
        stopTurbulence();
        phase3();
      }
    }
    requestAnimationFrame(tick);
  }

  // Phase 3: wheel appears, sectors reveal one by one
  const P3_DUR = 200;
  let p3Start = null;

  function phase3() {
    p3Start = performance.now();
    buildSymbolsSvg(currentAngle);

    function tick(now) {
      const t = Math.min((now - p3Start) / P3_DUR, 1);
      // fade out intro polygon
      introSvg.style.opacity = 1 - t;
      // fade in canvas
      canvas.style.opacity = t;

      if (t < 1) { requestAnimationFrame(tick); }
      else {
        introSvg.style.opacity = '0';
        canvas.style.opacity = '1';
        symbolsSvg.style.opacity = '1';
        arrowWrap.classList.add('visible');
        // reveal sectors one by one
        revealSectors(onDone);
      }
    }
    requestAnimationFrame(tick);
  }
}

function revealSectors(onDone) {
  const syms = symbolsSvg.querySelectorAll('.sector-sym');
  const n = syms.length;
  if (n === 0) { if (onDone) onDone(); return; }

  const perSector = Math.min(120, 600 / n);
  let i = 0;

  function next() {
    if (i >= n) { if (onDone) onDone(); return; }
    // fade in the i-th sector's symbol
    const el = syms[i];
    el.style.transition = 'opacity 0.25s';
    // also do a scale from center animation via transform
    el.style.transform = 'scale(0)';
    el.style.transformOrigin = '210px 210px'; // SVG center
    el.style.opacity = '0';

    requestAnimationFrame(() => {
      el.style.transition = 'opacity 0.3s, transform 0.3s cubic-bezier(0.34,1.56,0.64,1)';
      el.style.transform = 'scale(1)';
      el.style.opacity = '1';
    });

    i++;
    setTimeout(next, perSector);
  }
  next();
}

// ─────────────────────────────────────────────
// SPIN
// ─────────────────────────────────────────────
function spinTo(index, onDone) {
  if (isSpinning) return;
  isSpinning = true;

  const arcs = getArcs();
  let sectorStart = 0;
  for (let i = 0; i < index; i++) sectorStart += arcs[i];
  const sectorMid = sectorStart + arcs[index] / 2;

  const target = (Math.PI / 2) - sectorMid + Math.PI;
  const normalizedCurrent = currentAngle % (2 * Math.PI);
  let diff = target - normalizedCurrent;
  while (diff < 0) diff += 2 * Math.PI;
  while (diff > 2 * Math.PI) diff -= 2 * Math.PI;

  const extraSpins = (6 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
  const finalAngle = currentAngle + diff + extraSpins;
  const duration = 4500;
  const start = performance.now();
  const startAngle = currentAngle;

  // hide symbols during spin
  symbolsSvg.style.opacity = '0';

  function animateSpin(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    const ease = easeOutQuart(progress);
    currentAngle = startAngle + (finalAngle - startAngle) * ease;
    drawWheel(currentAngle);

    if (progress < 1) {
      requestAnimationFrame(animateSpin);
    } else {
      isSpinning = false;
      db.ref("history").push({ value: options[index].label, time: Date.now() });
      // rebuild symbols at new angle
      buildSymbolsSvg(currentAngle);
      symbolsSvg.style.opacity = '1';

      // After spin — winner zoom
      setTimeout(() => {
        showWinner(index, onDone);
      }, 800);
    }
  }
  requestAnimationFrame(animateSpin);
}

// ─────────────────────────────────────────────
// WINNER ZOOM
// ─────────────────────────────────────────────
function showWinner(index, onDone) {
  const cat = getCategory(index);
  const label = options[index].label;

  // Build winner symbol at center of 220x220 viewBox
  const cx = 110, cy = 95, r = 70;
  winnerSymbolSvg.innerHTML = `
    <defs>
      <filter id="wGlow">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#wGlow)" opacity="0" id="winnerG">
      ${symbolPath(cat, cx, cy, r).replace('stroke="#8b0000"', 'stroke="#cc0000" fill="rgba(139,0,0,0.15)"')}
    </g>`;

  const winnerG = winnerSymbolSvg.querySelector('#winnerG');
  winnerLabel.style.opacity = '0';
  winnerLabel.innerText = label;

  // hide wheel
  canvas.style.transition = 'opacity 0.5s';
  canvas.style.opacity = '0';
  symbolsSvg.style.opacity = '0';
  arrowWrap.classList.remove('visible');

  resultOverlay.classList.add('visible');

  // zoom in symbol
  winnerG.style.transform = 'scale(0.1)';
  winnerG.style.transformOrigin = `${cx}px ${cy}px`;
  winnerG.style.transition = 'transform 0.6s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s';
  winnerG.style.opacity = '0';

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      winnerG.style.transform = 'scale(1)';
      winnerG.style.opacity = '1';
    });
  });

  // pulse the symbol
  let pulseDir = 1;
  let pulseScale = 1;
  let pulseRaf;
  const pulseStart = performance.now();
  function pulse(now) {
    const t = (now - pulseStart) / 800;
    pulseScale = 1 + 0.05 * Math.sin(t * Math.PI * 2);
    winnerG.style.transform = `scale(${pulseScale})`;
    pulseRaf = requestAnimationFrame(pulse);
  }
  setTimeout(() => { pulseRaf = requestAnimationFrame(pulse); }, 700);

  // show label
  setTimeout(() => {
    winnerLabel.style.transition = 'opacity 0.5s';
    winnerLabel.style.opacity = '1';
  }, 900);

  // hide everything after 6s
  hideTimer = setTimeout(() => {
    cancelAnimationFrame(pulseRaf);
    resultOverlay.classList.remove('visible');
    canvas.style.opacity = '0';
    arrowWrap.classList.remove('visible');
    winnerLabel.style.opacity = '0';
    if (onDone) onDone();
  }, 6000);
}

// ─────────────────────────────────────────────
// QUEUE
// ─────────────────────────────────────────────
function processQueue() {
  if (processingQueue || spinQueue.length === 0) return;
  processingQueue = true;
  const index = spinQueue.shift();

  // reset canvas visibility for new spin
  canvas.style.transition = 'opacity 0.4s';
  canvas.style.opacity = '0';
  symbolsSvg.style.opacity = '0';
  arrowWrap.classList.remove('visible');

  // run intro animation then spin
  runIntroThenWheel(() => {
    spinTo(index, () => {
      processingQueue = false;
      if (spinQueue.length > 0) setTimeout(processQueue, 1500);
    });
  });
}
