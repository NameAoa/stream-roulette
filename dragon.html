<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Лента-рулетка | Ликорис</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    font-family: 'Cinzel', serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ===================== FALLING PETALS ===================== */
  .fall-petal {
    position: absolute;
    border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
    background: linear-gradient(180deg, #cc0000, #660000);
    opacity: 0;
    animation: fallPetal linear infinite;
    top: -20px;
    pointer-events: none;
    z-index: 20;
  }

  @keyframes fallPetal {
    0%   { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.8; }
    100% { transform: translateY(750px) rotate(400deg) translateX(50px); opacity: 0; }
  }

  /* ===================== LYCORIS ===================== */
  #lycoris-wrap {
    position: absolute;
    left: 30px;
    top: 50%;
    transform: translateY(-55%);
    width: 110px;
    height: 220px;
    z-index: 10;
  }

  #lycoris-svg {
    width: 100%;
    height: 100%;
    opacity: 0;
  }

  /* ===================== WIDGET ===================== */
  #widget {
    position: absolute;
    left: 120px;
    top: 50%;
    transform: translateY(-50%) scaleX(0);
    transform-origin: left center;
    opacity: 0;
    width: 500px;
  }

  .widget-outer {
    position: relative;
    background: #0d0d0d;
    border: 2.5px solid #cc0000;
    box-shadow:
      0 0 16px #ff000055,
      0 0 40px #cc000022,
      inset 0 0 20px #1a0000;
    border-radius: 3px;
    padding: 10px;
  }

  .widget-outer::before,
  .widget-outer::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    border-color: #ff2200;
    border-style: solid;
  }
  .widget-outer::before { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
  .widget-outer::after  { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

  /* ===================== SLOT VIEWPORT ===================== */
  .slot-viewport {
    position: relative;
    overflow: hidden;
    height: 90px;
    display: flex;
    align-items: center;
  }

  /* Center highlight — simple box, no side masks */
  .slot-center-highlight {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 158px;
    height: 88px;
    border: 2px solid #ff2200;
    box-shadow: 0 0 14px #ff220077, inset 0 0 12px #ff220015;
    z-index: 5;
    pointer-events: none;
    border-radius: 2px;
  }

  .slot-track {
    display: flex;
    gap: 10px;
    will-change: transform;
    position: relative;
  }

  /* ===================== LOT CARD ===================== */
  .lot-card {
    flex-shrink: 0;
    width: 148px;
    height: 84px;
    background: #0d0d0d;
    border: 1.5px solid #550000;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border-radius: 2px;
  }

  .lot-card::before {
    content: '';
    position: absolute;
    inset: 3px;
    border: 1px solid #2a0000;
    border-radius: 1px;
    pointer-events: none;
  }

  .smoke {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, #3a000066 0%, transparent 70%);
    pointer-events: none;
  }
  .smoke-1 { width: 36px; height: 18px; bottom: 4px; left: 6px; opacity: 0.5; }
  .smoke-2 { width: 24px; height: 12px; top: 6px; right: 8px; opacity: 0.35; }

  .lot-icon { font-size: 22px; line-height: 1; }

  .lot-name {
    color: #cc3333;
    font-size: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    padding: 0 8px;
    text-shadow: 0 0 6px #ff000066;
    line-height: 1.3;
  }

  .lot-card.winner {
    border-color: #ff2200;
    background: #180000;
    box-shadow: 0 0 18px #ff220044, inset 0 0 12px #2a0000;
  }

  /* ===================== WINNER TEXT ===================== */
  #winner-display {
    text-align: center;
    margin-top: 8px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #winner-text {
    color: #ff3300;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-shadow: 0 0 14px #ff0000, 0 0 30px #ff000055;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.5s, transform 0.5s;
  }

  #winner-text.show {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>

<div id="lycoris-wrap">
  <svg id="lycoris-svg" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
    <path id="stem" d="M100 400 Q95 300 100 200"
          stroke="#660000" stroke-width="4" fill="none"
          stroke-dasharray="230" stroke-dashoffset="230"/>
    <path id="leaf1" d="M98 310 Q70 290 58 268" stroke="#440000" stroke-width="2.5" fill="none" opacity="0"/>
    <path id="leaf2" d="M102 275 Q132 255 144 232" stroke="#440000" stroke-width="2.5" fill="none" opacity="0"/>
    <g id="flower-head" transform="translate(100,195)" opacity="0">
      <g id="stamens" opacity="0">
        <line x1="0" y1="0" x2="-32" y2="-46" stroke="#cc0000" stroke-width="1.3"/>
        <line x1="0" y1="0" x2="-16" y2="-52" stroke="#cc0000" stroke-width="1.3"/>
        <line x1="0" y1="0" x2="5"   y2="-54" stroke="#cc0000" stroke-width="1.3"/>
        <line x1="0" y1="0" x2="23"  y2="-49" stroke="#cc0000" stroke-width="1.3"/>
        <line x1="0" y1="0" x2="36"  y2="-39" stroke="#cc0000" stroke-width="1.3"/>
        <line x1="0" y1="0" x2="42"  y2="-23" stroke="#cc0000" stroke-width="1.3"/>
        <circle cx="-32" cy="-46" r="2.8" fill="#ff2200"/>
        <circle cx="-16" cy="-52" r="2.8" fill="#ff2200"/>
        <circle cx="5"   cy="-54" r="2.8" fill="#ff2200"/>
        <circle cx="23"  cy="-49" r="2.8" fill="#ff2200"/>
        <circle cx="36"  cy="-39" r="2.8" fill="#ff2200"/>
        <circle cx="42"  cy="-23" r="2.8" fill="#ff2200"/>
      </g>
      <path class="petal-path" d="M0,0 Q-50,-20 -55,-60 Q-30,-40 0,-10 Z" fill="#cc0000" opacity="0"/>
      <path class="petal-path" d="M0,0 Q-40,-50 -20,-80 Q-10,-50 0,-10 Z" fill="#cc0000" opacity="0"/>
      <path class="petal-path" d="M0,0 Q0,-60 30,-75 Q10,-45 0,-10 Z"     fill="#cc0000" opacity="0"/>
      <path class="petal-path" d="M0,0 Q45,-40 55,-65 Q25,-35 0,-10 Z"    fill="#cc0000" opacity="0"/>
      <path class="petal-path" d="M0,0 Q55,-5 50,-45 Q25,-15 0,-10 Z"     fill="#cc0000" opacity="0"/>
      <path class="petal-path" d="M0,0 Q55,25 40,-20 Q20,-5 0,-10 Z"      fill="#cc0000" opacity="0"/>
    </g>
  </svg>
</div>

<div id="widget">
  <div class="widget-outer">
    <div class="slot-viewport">
      <div class="slot-center-highlight"></div>
      <div class="slot-track" id="slot-track"></div>
    </div>
    <div id="winner-display">
      <div id="winner-text"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script>
const LOTS = [
  { name: 'Арт по вашему персонажу', icon: '🎨' },
  { name: 'Озвучка персонажа',       icon: '🎤' },
  { name: 'Стрим по вашей игре',     icon: '🎮' },
  { name: 'Чат-команда',             icon: '⚡' },
  { name: 'Рисунок Ликориса',        icon: '🌺' },
  { name: 'Эмоут на канал',          icon: '✨' },
  { name: 'Особый лот',              icon: '💀' },
  { name: 'Сюрприз',                 icon: '🎁' },
];

const CARD_W  = 148;
const GAP     = 10;
const STEP    = CARD_W + GAP;
const SETS    = 6; // enough cards to scroll through

const track = document.getElementById('slot-track');
let allCards = [];

function buildTrack() {
  track.innerHTML = '';
  allCards = [];
  for (let s = 0; s < SETS; s++) {
    LOTS.forEach((lot, i) => {
      const card = document.createElement('div');
      card.className = 'lot-card';
      card.innerHTML = `
        <div class="smoke smoke-1"></div>
        <div class="smoke smoke-2"></div>
        <div class="lot-icon">${lot.icon}</div>
        <div class="lot-name">${lot.name}</div>`;
      track.appendChild(card);
      allCards.push(card);
    });
  }
}
buildTrack();

// Viewport: widget 500px, padding 10px each side → 480px usable
const VIEWPORT_W = 480;
const CENTER_OFFSET = VIEWPORT_W / 2 - CARD_W / 2; // offset so a card at index 0 is centered

// Start showing set index 1 (so cards exist both before and after)
const START_SET = 1;
let currentTranslateX = CENTER_OFFSET - START_SET * LOTS.length * STEP;
track.style.transform = `translateX(${currentTranslateX}px)`;

// ===================== PETALS =====================
function spawnPetals() {
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'fall-petal';
    p.style.left   = Math.random() * 1280 + 'px';
    p.style.width  = (3 + Math.random() * 4) + 'px';
    p.style.height = (10 + Math.random() * 12) + 'px';
    p.style.animationDuration = (5 + Math.random() * 7) + 's';
    p.style.animationDelay   = (Math.random() * 10) + 's';
    document.body.appendChild(p);
  }
}

// ===================== INTRO =====================
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function runIntro() {
  const lycoris = document.getElementById('lycoris-svg');
  lycoris.style.opacity = '1';

  await new Promise(r => anime({
    targets: '#stem',
    strokeDashoffset: [230, 0],
    duration: 900, easing: 'easeInOutQuad', complete: r
  }));

  anime({ targets: '#leaf1', opacity: [0, 0.85], duration: 280, easing: 'easeOutQuad' });
  await delay(130);
  anime({ targets: '#leaf2', opacity: [0, 0.85], duration: 280, easing: 'easeOutQuad' });
  await delay(300);

  anime({ targets: '#flower-head', opacity: [0, 1], duration: 200, easing: 'easeOutQuad' });
  await delay(130);

  anime({ targets: '#stamens', opacity: [0, 1], duration: 300, easing: 'easeOutBack' });
  await delay(80);

  for (const p of document.querySelectorAll('.petal-path')) {
    anime({ targets: p, opacity: [0, 1], scale: [0.2, 1], duration: 220, easing: 'easeOutBack' });
    await delay(55);
  }

  await delay(350);

  await new Promise(r => anime({
    targets: '#widget',
    opacity:  [0, 1],
    scaleX:   [0, 1],
    duration: 600, easing: 'easeOutExpo', complete: r
  }));

  spawnPetals();
}

// ===================== SPIN =====================
let spinning = false;

function triggerSpin() {
  if (spinning) return;
  spinning = true;

  allCards.forEach(c => c.classList.remove('winner'));
  const wt = document.getElementById('winner-text');
  wt.classList.remove('show');

  const winnerIdx = Math.floor(Math.random() * LOTS.length);

  // Land somewhere in set 3 (index 2) for a good scroll distance
  const landCardAbsolute = 2 * LOTS.length + winnerIdx;
  const targetX = CENTER_OFFSET - landCardAbsolute * STEP;

  anime({
    targets: track,
    translateX: targetX,
    duration: 4500,
    easing: 'cubicBezier(0.12, 0.9, 0.2, 1.0)',
    complete() {
      currentTranslateX = targetX;
      allCards[landCardAbsolute].classList.add('winner');

      wt.textContent = `✦ ${LOTS[winnerIdx].name} ✦`;
      wt.classList.add('show');

      anime({
        targets: '.widget-outer',
        boxShadow: [
          '0 0 16px #ff000055, 0 0 40px #cc000022, inset 0 0 20px #1a0000',
          '0 0 55px #ff0000bb, 0 0 100px #cc000077, inset 0 0 20px #1a0000',
          '0 0 16px #ff000055, 0 0 40px #cc000022, inset 0 0 20px #1a0000',
        ],
        duration: 700, easing: 'easeInOutSine',
        complete: () => { spinning = false; }
      });
    }
  });
}

window.triggerSpin = triggerSpin;

// For demo: click anywhere to spin
document.body.addEventListener('click', triggerSpin);

window.addEventListener('load', runIntro);
</script>
</body>
</html>
