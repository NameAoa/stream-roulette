<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OBS Roulette</title>
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; overflow: hidden;
    }
    .scale-wrap {
      width: 380px; opacity: 0;
      transition: opacity 0.4s; margin-bottom: 12px;
    }
    .scale-wrap.visible { opacity: 1; }
    .scale-label {
      color: #fff; font-size: 32px;
      font-family: 'Poiret One', cursive;
      text-align: center;
      text-shadow: 0 0 12px rgba(140,80,200,0.8);
      letter-spacing: 2px;
    }
    .wheel-wrap {
      position: relative; width: 420px; height: 420px;
      opacity: 0; transform: scale(0.8);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .wheel-wrap.visible { opacity: 1; transform: scale(1); }
    canvas {
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(140,80,200,0.6);
    }
    .arrow-wrap {
      position: absolute; top: -18px; left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
    }
    .arrow-wrap svg { width: 36px; height: 52px; }
    #spinResult {
      margin-top: 16px;
      min-height: 90px;
      font-size: 36px;
      font-family: 'Poiret One', cursive;
      color: #fff;
      text-shadow: 0 0 20px rgba(140,80,200,0.9);
      letter-spacing: 3px;
      opacity: 0;
      transition: opacity 0.5s;
      text-align: center;
    }
    #spinResult.visible { opacity: 1; }
  </style>
</head>
<body>

<div class="scale-wrap" id="scaleWrap">
  <div class="scale-label" id="scaleLabel">Колесо 0/150</div>
</div>

<div class="wheel-wrap" id="wheelWrap">
  <div class="arrow-wrap">
    <svg viewBox="0 0 36 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#666"/>
          <stop offset="30%" style="stop-color:#ddd"/>
          <stop offset="60%" style="stop-color:#aaa"/>
          <stop offset="100%" style="stop-color:#555"/>
        </linearGradient>
      </defs>
      <polygon points="18,52 0,4 36,4" fill="url(#metalGrad)"/>
      <rect x="6" y="0" width="24" height="8" rx="2" fill="url(#metalGrad)" stroke="#333" stroke-width="1"/>
    </svg>
  </div>
  <canvas id="wheel" width="420" height="420"></canvas>
</div>

<div id="spinResult"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCw4Fr5SrDh67kHtflFSZm7EJ4T5o-neQs",
  authDomain: "roulette-twitch-2c7a3.firebaseapp.com",
  databaseURL: "https://roulette-twitch-2c7a3-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "roulette-twitch-2c7a3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ─── Canvas ───────────────────────────────────────
const wheelCanvas = document.getElementById("wheel");
const wCtx = wheelCanvas.getContext("2d");

const pCanvas = document.getElementById("particleCanvas");
const pCtx = pCanvas.getContext("2d");

const scaleLabel = document.getElementById("scaleLabel");
const scaleWrap = document.getElementById("scaleWrap");
const wheelWrap = document.getElementById("wheelWrap");

// resize particles canvas
function resize() {
  pCanvas.width = innerWidth;
  pCanvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

// ─── STATE ────────────────────────────────────────
let options = [];
let goal = 150;
let currentAngle = 0;

let particles = [];
let particleAnimId = null;

let dissolveProgress = 0;

// ─── COLORS ───────────────────────────────────────
const COLORS = ["#3d1a6e","#5a2d91","#7b4fa6","#9d6dbf"];

// ─── FIX 1: lighten ───────────────────────────────
function lighten(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${
    Math.min(255, (n >> 16) + amt)
  },${
    Math.min(255, ((n >> 8) & 255) + amt)
  },${
    Math.min(255, (n & 255) + amt)
  })`;
}

// ─── FIX 2: DRAW WHEEL ────────────────────────────
function drawWheel(angle){
  const W = wheelCanvas.width;
  const H = wheelCanvas.height;

  const cx = W/2;
  const cy = H/2;
  const R  = cx - 5;

  wCtx.clearRect(0,0,W,H);

  if(!options.length) return;

  const total = options.length;
  const arc = Math.PI*2/total;

  let a = angle;

  for(let i=0;i<options.length;i++){

    const a2 = a + arc;

    wCtx.beginPath();
    wCtx.moveTo(cx,cy);
    wCtx.arc(cx,cy,R,a,a2);
    wCtx.closePath();

    wCtx.fillStyle = COLORS[i % COLORS.length];
    wCtx.fill();

    wCtx.strokeStyle = "rgba(255,255,255,0.3)";
    wCtx.stroke();

    // text
    const mid = a + arc/2;

    wCtx.save();
    wCtx.translate(cx,cy);
    wCtx.rotate(mid);
    wCtx.fillStyle="#fff";
    wCtx.font="14px Poiret One";
    wCtx.textAlign="right";
    wCtx.fillText(options[i].label, R-10, 5);
    wCtx.restore();

    a = a2;
  }
}

// ─── FIX 3: TEXT TARGETS ─────────────────────────
function buildTextTargets(label, centerX, centerY){

  const W = 900, H = 260;

  const off = document.createElement("canvas");
  off.width = W;
  off.height = H;
  const oc = off.getContext("2d");

  let fs = 70;

  function fits(text){
    oc.font = `bold ${fs}px 'Poiret One'`;
    return oc.measureText(text).width < W-40;
  }

  const words = label.split(" ");
  let lines = [];
  let cur = "";

  for(let w of words){
    let test = cur ? cur+" "+w : w;
    if(fits(test)) cur = test;
    else { lines.push(cur); cur = w; }
  }
  if(cur) lines.push(cur);

  oc.font = `bold ${fs}px 'Poiret One'`;
  oc.fillStyle="#fff";
  oc.textAlign="center";
  oc.textBaseline="middle";

  const lh = fs*1.2;
  const startY = H/2 - (lines.length*lh)/2;

  lines.forEach((l,i)=>{
    oc.fillText(l, W/2, startY + i*lh);
  });

  const data = oc.getImageData(0,0,W,H).data;
  const pts = [];

  for(let y=0;y<H;y+=3){
    for(let x=0;x<W;x+=3){
      if(data[(y*W+x)*4+3] > 120){
        pts.push({
          x: centerX + (x - W/2),
          y: centerY + (y - H/2)
        });
      }
    }
  }

  return pts;
}

// ─── PARTICLES ───────────────────────────────────
class Particle{
  constructor(x,y,color){
    this.x=x;
    this.y=y;
    this.color=color;
    this.vx=(Math.random()-0.5)*4;
    this.vy=-Math.random()*4;
    this.gravity=0.15;
    this.alpha=1;
    this.phase="fall";
  }

  update(){
    if(this.phase==="fall"){
      this.vy += this.gravity;
      this.x += this.vx;
      this.y += this.vy;
    } else {
      const dx=this.tx-this.x;
      const dy=this.ty-this.y;
      this.x += dx*0.08;
      this.y += dy*0.08;
    }
  }

  draw(){
    pCtx.globalAlpha=this.alpha;
    pCtx.fillStyle=this.color;
    pCtx.fillRect(this.x,this.y,2,2);
  }
}

// ─── SPAWN SAND ──────────────────────────────────
function spawnParticles(){
  particles=[];

  const cx = pCanvas.width/2;
  const cy = pCanvas.height/2;

  for(let i=0;i<6000;i++){
    const p = new Particle(
      cx + (Math.random()-0.5)*200,
      cy + (Math.random()-0.5)*200,
      COLORS[i % COLORS.length]
    );
    particles.push(p);
  }

  animateParticles();
}

function animateParticles(){
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);

  for(const p of particles){
    p.update();
    p.draw();
  }

  particleAnimId = requestAnimationFrame(animateParticles);
}

// ─── FIREBASE ─────────────────────────────────────
db.ref("options").on("value",snap=>{
  if(snap.val()){
    options = snap.val();
    drawWheel(currentAngle);
  }
});

db.ref("goal").on("value",snap=>{
  goal = snap.val() || 150;
});

// FIX 4
db.ref("donateTotal").on("value",snap=>{
  const total = snap.val() || 0;
  scaleLabel.innerText = `Колесо ${total}/${goal}`;
  scaleWrap.classList.add("visible");
});

wheelWrap.classList.add("visible");
drawWheel(0);

</script>
</body>
</html>
