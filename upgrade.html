<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OBS Roulette FIXED</title>

<link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background:transparent;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  overflow:hidden;
  font-family:'Poiret One';
}

#wheelWrap {
  position:relative;
  width:420px;
  height:420px;
}

#particleCanvas {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
}

#label {
  position:absolute;
  bottom:40px;
  width:100%;
  text-align:center;
  font-size:42px;
  color:#fff;
}
</style>
</head>

<body>

<canvas id="particleCanvas"></canvas>

<div id="wheelWrap">
  <canvas id="wheel" width="420" height="420"></canvas>
</div>

<div id="label"></div>

<script>
const wheel = document.getElementById("wheel");
const ctx = wheel.getContext("2d");
const pCanvas = document.getElementById("particleCanvas");
const pCtx = pCanvas.getContext("2d");
const label = document.getElementById("label");

pCanvas.width = window.innerWidth;
pCanvas.height = window.innerHeight;

let options = [
  {label:"Очень длинный тестовый лот чтобы проверить перенос текста"},
  {label:"Второй вариант"},
  {label:"Третий"}
];

let angle = 0;
let dissolve = 0;
let dissolving = false;
let particles = [];

function drawWheel() {
  const W = wheel.width;
  const H = wheel.height;
  const cx = W/2, cy = H/2;
  const R = cx - 5;

  ctx.clearRect(0,0,W,H);

  let step = (Math.PI*2)/options.length;

  for(let i=0;i<options.length;i++){
    let a = angle + i*step;

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,R,a,a+step);
    ctx.closePath();

    ctx.fillStyle = `hsl(${i*60},60%,50%)`;
    ctx.fill();

    // распад сверху вниз
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillRect(0,0,W,H*dissolve);
    ctx.globalCompositeOperation = "source-over";
  }
}

class Particle{
  constructor(x,y){
    this.x=x;
    this.y=y;
    this.vx=(Math.random()-0.5)*2;
    this.vy=Math.random()*2+1;
    this.size=Math.random()*1.2+0.3;
    this.tx=0;
    this.ty=0;
    this.phase="fall";
  }

  update(){
    if(this.phase==="fall"){
      this.x+=this.vx;
      this.y+=this.vy;

      this.vy+=0.05;

    } else {
      this.x += (this.tx-this.x)*0.08;
      this.y += (this.ty-this.y)*0.08;
    }
  }

  draw(){
    pCtx.fillStyle="#fff";
    pCtx.fillRect(this.x,this.y,this.size,this.size);
  }
}

function spawnParticles(){
  particles=[];
  const rect = wheel.getBoundingClientRect();

  for(let i=0;i<4000;i++){
    let x = rect.left + Math.random()*rect.width;
    let y = rect.top + Math.random()*rect.height;

    let p = new Particle(x,y);
    p.vx*=0.3;
    particles.push(p);
  }
}

function buildTextTargets(text){
  const off = document.createElement("canvas");
  off.width = 800;
  off.height = 200;
  const oc = off.getContext("2d");

  let fs = 80;

  oc.font = `bold ${fs}px Poiret One`;
  while(oc.measureText(text).width > 760 && fs>30){
    fs-=4;
    oc.font = `bold ${fs}px Poiret One`;
  }

  oc.fillStyle="#fff";
  oc.textAlign="center";
  oc.fillText(text,400,100);

  let data = oc.getImageData(0,0,800,200).data;
  let pts=[];

  for(let y=0;y<200;y+=3){
    for(let x=0;x<800;x+=3){
      if(data[(y*800+x)*4+3]>120){
        pts.push({
          x: pCanvas.width/2 + (x-400),
          y: pCanvas.height-120 + (y-100)
        });
      }
    }
  }

  return pts;
}

function gather(text){
  let pts = buildTextTargets(text);

  particles.forEach((p,i)=>{
    if(i<pts.length){
      p.tx=pts[i].x;
      p.ty=pts[i].y;
      p.phase="gather";
    }
  });
}

function loop(){
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);

  particles.forEach(p=>{
    p.update();
    p.draw();
  });

  requestAnimationFrame(loop);
}

loop();

function spin(){
  let win = options[Math.floor(Math.random()*options.length)];

  spawnParticles();

  dissolving=true;
  dissolve=0;

  let t=0;

  function anim(){
    t+=0.01;
    dissolve = Math.min(t,1);

    drawWheel();

    if(t<1){
      requestAnimationFrame(anim);
    } else {
      setTimeout(()=>{
        gather(win.label);
      },800);
    }
  }

  anim();
}

drawWheel();

// тестовый запуск
setTimeout(spin,1000);
</script>

</body>
</html>
