<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OBS Roulette</title>

<link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body{
  background:transparent;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  overflow:hidden;
}

.scale-wrap{
  width:380px;
  opacity:0;
  transition:0.4s;
  margin-bottom:12px;
}
.scale-wrap.visible{opacity:1;}

.scale-label{
  color:#fff;
  font-size:32px;
  font-family:'Poiret One';
  text-align:center;
  text-shadow:0 0 12px rgba(140,80,200,0.8);
}

.wheel-wrap{
  position:relative;
  width:420px;
  height:420px;
  opacity:0;
  transform:scale(0.8);
  transition:0.5s;
}
.wheel-wrap.visible{
  opacity:1;
  transform:scale(1);
}

#particleCanvas{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
}

#spinResult{
  margin-top:16px;
  font-size:48px;
  color:#fff;
  opacity:0;
}
</style>
</head>

<body>

<canvas id="particleCanvas"></canvas>

<div class="scale-wrap" id="scaleWrap">
  <div class="scale-label" id="scaleLabel">Колесо 0/150</div>
</div>

<div class="wheel-wrap" id="wheelWrap">
  <canvas id="wheel" width="420" height="420"></canvas>
</div>

<div id="spinResult"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>

// Firebase
firebase.initializeApp({
  apiKey:"AIzaSyCw4Fr5SrDh67kHtflFSZm7EJ4T5o-neQs",
  authDomain:"roulette-twitch-2c7a3.firebaseapp.com",
  databaseURL:"https://roulette-twitch-2c7a3-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId:"roulette-twitch-2c7a3"
});

const db = firebase.database();

// Canvas
const wheel = document.getElementById("wheel");
const ctx = wheel.getContext("2d");

// UI
const scaleLabel = document.getElementById("scaleLabel");
const scaleWrap = document.getElementById("scaleWrap");
const wheelWrap = document.getElementById("wheelWrap");

// State
let options = [];
let goal = 150;
let angle = 0;

// Colors
const COLORS = ["#3d1a6e","#5a2d91","#7b4fa6","#9d6dbf"];

// FIXED lighten
function lighten(hex, amt){
  const n = parseInt(hex.slice(1),16);
  return `rgb(
    ${Math.min(255,(n>>16)+amt)},
    ${Math.min(255,((n>>8)&255)+amt)},
    ${Math.min(255,(n&255)+amt)}
  )`;
}

// Draw wheel
function drawWheel(){
  const W = wheel.width;
  const H = wheel.height;

  ctx.clearRect(0,0,W,H);

  if(!options.length) return;

  const total = options.length;
  const arc = (Math.PI*2)/total;

  for(let i=0;i<options.length;i++){

    ctx.beginPath();
    ctx.moveTo(W/2,H/2);
    ctx.arc(W/2,H/2,W/2-5,i*arc,(i+1)*arc);
    ctx.closePath();

    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();

    ctx.fillStyle="#fff";
    ctx.font="14px Poiret One";
    ctx.textAlign="center";

    const mid = i*arc + arc/2;
    const x = W/2 + Math.cos(mid)*120;
    const y = H/2 + Math.sin(mid)*120;

    ctx.fillText(options[i].label,x,y);
  }
}

// Firebase listeners
db.ref("options").on("value",snap=>{
  if(snap.val()){
    options = snap.val();
    drawWheel();
  }
});

db.ref("goal").on("value",snap=>{
  if(snap.val()) goal = snap.val();
});

db.ref("donateTotal").on("value",snap=>{
  const total = snap.val() || 0;

  scaleLabel.innerText = `Колесо ${total}/${goal}`;
  scaleWrap.classList.add("visible");
});

// show wheel
wheelWrap.classList.add("visible");

</script>
</body>
</html>
