<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OBS Roulette</title>
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      height: 100vh; overflow: hidden;
      padding-top: 20px;
    }
    .scale-wrap {
      width: 380px; opacity: 0;
      transition: opacity 0.4s; margin-bottom: 12px;
      flex-shrink: 0;
    }
    .scale-wrap.visible { opacity: 1; }
    .scale-label {
      color: #fff; font-size: 32px;
      font-family: 'Poiret One', cursive;
      text-align: center;
      text-shadow: 0 0 12px rgba(140,80,200,0.8);
      letter-spacing: 2px;
    }
    .wheel-wrap {
      position: relative; width: 420px; height: 420px;
      opacity: 0; transform: scale(0.8);
      transition: opacity 0.5s ease, transform 0.5s ease;
      flex-shrink: 0;
    }
    .wheel-wrap.visible { opacity: 1; transform: scale(1); }
    #wheel { display: block; }
    #particleCanvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 100;
    }
    #arrowCanvas {
      position: absolute; top: -22px; left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    #resultZone {
      width: 100%;
      height: 160px;
      flex-shrink: 0;
      position: relative;
      z-index: 5;
    }
  </style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div class="scale-wrap" id="scaleWrap">
  <div class="scale-label" id="scaleLabel">Колесо 0/150</div>
</div>

<div class="wheel-wrap" id="wheelWrap">
  <canvas id="arrowCanvas" width="40" height="62"></canvas>
  <canvas id="wheel" width="420" height="420"></canvas>
</div>

<div id="resultZone"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCw4Fr5SrDh67kHtflFSZm7EJ4T5o-neQs",
  authDomain: "roulette-twitch-2c7a3.firebaseapp.com",
  databaseURL: "https://roulette-twitch-2c7a3-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "roulette-twitch-2c7a3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const COLORS = [
  "#3d1a6e","#5a2d91","#7b4fa6","#9d6dbf",
  "#4a2278","#6b3d9e","#8c5ab5","#b07fd4"
];

const wheelCanvas = document.getElementById("wheel");
const wCtx        = wheelCanvas.getContext("2d");
const arrowCanvas = document.getElementById("arrowCanvas");
const aCtx        = arrowCanvas.getContext("2d");
const pCanvas     = document.getElementById("particleCanvas");
const pCtx        = pCanvas.getContext("2d");
const wheelWrap   = document.getElementById("wheelWrap");
const scaleWrap   = document.getElementById("scaleWrap");
const scaleLabel  = document.getElementById("scaleLabel");
const resultZone  = document.getElementById("resultZone");

function resizeP() { pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
resizeP();
window.addEventListener("resize", resizeP);

let options = [], goal = 150, currentAngle = 0;
let isSpinning = false, hideTimer = null;
let spinQueue = [], processingQueue = false;
let particles = [], particleAnimId = null;
let lastArrowSector = -1;

// ─── Spring Arrow ─────────────────────────────────────────────────────────────
const spring = { angle: 0, vel: 0, stiffness: 0.30, damping: 0.52 };
function tickSpring() {
  const f = -spring.stiffness * spring.angle - spring.damping * spring.vel;
  spring.vel += f; spring.angle += spring.vel;
}
function renderArrow() {
  const W = arrowCanvas.width, H = arrowCanvas.height;
  aCtx.clearRect(0, 0, W, H);
  aCtx.save();
  aCtx.translate(W/2, H-4); aCtx.rotate(spring.angle); aCtx.translate(-W/2, -(H-4));
  const grd = aCtx.createLinearGradient(0,0,W,0);
  grd.addColorStop(0,"#555"); grd.addColorStop(0.28,"#ddd");
  grd.addColorStop(0.62,"#aaa"); grd.addColorStop(1,"#555");
  aCtx.beginPath(); aCtx.moveTo(W/2,H-4); aCtx.lineTo(3,10); aCtx.lineTo(W-3,10);
  aCtx.closePath(); aCtx.fillStyle=grd; aCtx.shadowColor="rgba(0,0,0,0.65)";
  aCtx.shadowBlur=7; aCtx.fill();
  aCtx.shadowBlur=0; aCtx.beginPath(); aCtx.roundRect(6,1,W-12,12,3);
  aCtx.fillStyle=grd; aCtx.strokeStyle="#333"; aCtx.lineWidth=1; aCtx.fill(); aCtx.stroke();
  aCtx.restore();
}
function kickArrow() { spring.vel += (Math.random()>0.5?1:-1)*0.22; }
(function arrowLoop() { tickSpring(); renderArrow(); requestAnimationFrame(arrowLoop); })();

// ─── Wheel helpers ────────────────────────────────────────────────────────────
function getArcs() {
  const total = options.reduce((s,o) => s+(o.weight||1), 0);
  return options.map(o => ((o.weight||1)/total)*Math.PI*2);
}
function getSectorUnderArrow(angle) {
  if (!options.length) return -1;
  const arcs = getArcs();
  const norm = (((-Math.PI/2)-angle)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  let cum = 0;
  for (let i=0;i<arcs.length;i++) { cum+=arcs[i]; if(norm<cum) return i; }
  return 0;
}
function lighten(hex, amt) {
  const n = parseInt(hex.slice(1),16);
  return `rgb(${Math.min(255,(n>>16)+amt)},${Math.min(255,((n>>8)&0xff)+amt)},${Math.min(255,(n&0xff)+amt)})`;
}

// ─── Draw wheel ───────────────────────────────────────────────────────────────
function drawWheel(angle, hlIdx=-1) {
  const W = wheelCanvas.width, H = wheelCanvas.height;
  const cx = W/2, cy = H/2, R = cx-5;
  wCtx.clearRect(0,0,W,H);
  if (!options.length) return;

  const arcs = getArcs();
  let sa = angle;

  // Sectors inside clip
  wCtx.save();
  wCtx.beginPath(); wCtx.arc(cx,cy,R,0,Math.PI*2); wCtx.clip();
  for (let i=0;i<options.length;i++) {
    const ea=sa+arcs[i], isHl=i===hlIdx, base=COLORS[i%COLORS.length];
    wCtx.globalAlpha=(hlIdx!==-1&&!isHl)?0.35:1;
    const g=wCtx.createRadialGradient(cx,cy,0,cx,cy,R);
    if(isHl){g.addColorStop(0,lighten(base,130));g.addColorStop(0.5,lighten(base,80));g.addColorStop(1,lighten(base,40));}
    else{g.addColorStop(0,lighten(base,50));g.addColorStop(1,base);}
    wCtx.beginPath(); wCtx.moveTo(cx,cy); wCtx.arc(cx,cy,R,sa,ea); wCtx.closePath();
    wCtx.fillStyle=g; wCtx.fill();
    // divider
    wCtx.globalAlpha=isHl?0.85:0.22;
    wCtx.strokeStyle=isHl?"rgba(255,230,255,1)":"rgba(255,255,255,1)";
    wCtx.lineWidth=isHl?2.5:1.5; wCtx.stroke();
    sa=ea;
  }
  wCtx.restore();

  // Outer ring — drawn OUTSIDE clip so it's always a full ring
  wCtx.save();
  wCtx.beginPath(); wCtx.arc(cx,cy,R,0,Math.PI*2);
  wCtx.strokeStyle="rgba(170,100,255,0.8)"; wCtx.lineWidth=5; wCtx.stroke();
  wCtx.restore();

  // Labels
  sa=angle;
  for(let i=0;i<options.length;i++){
    const arc=arcs[i], isHl=i===hlIdx;
    wCtx.save();
    wCtx.globalAlpha=(hlIdx!==-1&&!isHl)?0.35:1;
    wCtx.translate(cx,cy); wCtx.rotate(sa+arc/2);
    wCtx.textAlign="right"; wCtx.fillStyle="#fff";
    wCtx.font=isHl?"bold 14px 'Poiret One'":"13px 'Poiret One'";
    wCtx.shadowColor="rgba(0,0,0,0.9)"; wCtx.shadowBlur=4;
    wCtx.fillText(options[i].label,R-14,6);
    wCtx.restore(); sa+=arc;
  }
}

// ─── Snapshot wheel pixels ────────────────────────────────────────────────────
function snapshotWheelPixels(screenCx, screenCy) {
  const W=wheelCanvas.width, H=wheelCanvas.height;
  const imgData=wCtx.getImageData(0,0,W,H);
  const d=imgData.data;
  const list=[];
  for(let py=0;py<H;py+=2){
    for(let px=0;px<W;px+=2){
      const idx=(py*W+px)*4;
      if(d[idx+3]<30) continue;
      list.push({
        sx: screenCx-W/2+px,
        sy: screenCy-H/2+py,
        r:d[idx], g:d[idx+1], b:d[idx+2],
        a:d[idx+3]/255,
        normY: py/H   // 0=top, 1=bottom
      });
    }
  }
  return list;
}

// ─── Text targets ─────────────────────────────────────────────────────────────
function buildTextTargets(label, centerX, centerY) {
  const W=600, H=180;
  const off=document.createElement("canvas");
  off.width=W; off.height=H;
  const oc=off.getContext("2d");

  const words=label.split(" ");
  let lines=[], current="", fs=40;
  function fits(t){ oc.font=`bold ${fs}px 'Poiret One'`; return oc.measureText(t).width<W-30; }
  for(const w of words){
    const test=current?current+" "+w:w;
    if(fits(test)) current=test;
    else{if(current)lines.push(current);current=w;}
  }
  if(current) lines.push(current);
  while(lines.some(l=>!fits(l))&&fs>16) fs-=2;

  oc.font=`bold ${fs}px 'Poiret One'`;
  oc.fillStyle="#fff"; oc.textAlign="center"; oc.textBaseline="middle";
  const lh=fs*1.3, startY=H/2-((lines.length-1)*lh)/2;
  lines.forEach((line,i)=>oc.fillText(line,W/2,startY+i*lh));

  const data=oc.getImageData(0,0,W,H).data;
  const pts=[];
  for(let y=0;y<H;y+=2){
    for(let x=0;x<W;x+=2){
      if(data[(y*W+x)*4+3]>80){
        pts.push({x:centerX+(x-W/2), y:centerY+(y-H/2)});
      }
    }
  }
  return pts;
}

// ─── Particle ─────────────────────────────────────────────────────────────────
class Particle {
  constructor(sx,sy,r,g,b,alpha,normY){
    this.x=sx; this.y=sy;
    this.r=r; this.g=g; this.b=b; this.alpha=alpha;
    this.size=0.6+Math.random()*1.4;
    this.phase="fall";
    this.tx=0; this.ty=0;
    // top pixels fall sooner (delay=0), bottom pixels wait longer
    this.delay=Math.floor(normY*100);
    // tiny random scatter
    const ang=Math.random()*Math.PI*2;
    const spd=0.2+Math.random()*0.8;
    this.vx=Math.cos(ang)*spd*0.5+(Math.random()-0.5)*0.4;
    this.vy=Math.sin(ang)*spd*0.3+0.2;
    this.grav=0.05+Math.random()*0.04;
    this.rot=Math.random()*Math.PI*2;
    this.rotV=(Math.random()-0.5)*0.08;
  }
  update(){
    if(this.delay>0){this.delay--;return;}
    if(this.phase==="fall"){
      this.vy+=this.grav; this.vx*=0.985;
      this.x+=this.vx; this.y+=this.vy; this.rot+=this.rotV;
      if(this.y>pCanvas.height+80) this.alpha=0;
    } else {
      const dx=this.tx-this.x, dy=this.ty-this.y;
      this.x+=dx*0.10; this.y+=dy*0.10;
      // gradually whiten
      this.r=Math.min(255,this.r+10);
      this.g=Math.min(255,this.g+10);
      this.b=Math.min(255,this.b+10);
      this.alpha=Math.min(1,this.alpha+0.06);
    }
  }
  draw(){
    if(this.alpha<=0.02) return;
    pCtx.save();
    pCtx.globalAlpha=this.alpha;
    pCtx.fillStyle=`rgb(${this.r},${this.g},${this.b})`;
    pCtx.translate(this.x,this.y); pCtx.rotate(this.rot);
    pCtx.fillRect(-this.size/2,-this.size/2,this.size,this.size);
    pCtx.restore();
  }
}

// ─── Particle loop ────────────────────────────────────────────────────────────
function runParticles(){
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  particles=particles.filter(p=>p.alpha>0.02);
  for(const p of particles){p.update();p.draw();}
  if(particles.length){
    particleAnimId=requestAnimationFrame(runParticles);
  } else {
    pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
    particleAnimId=null;
  }
}

// ─── Dissolve: erase wheel top→bottom, each erased pixel becomes a particle ───
function startDissolve(screenCx, screenCy) {
  const pixelList=snapshotWheelPixels(screenCx, screenCy);
  // Sort by normY for clarity
  pixelList.sort((a,b)=>a.normY-b.normY);

  // Create all particles immediately — delay handles the stagger
  particles=[];
  for(const px of pixelList){
    particles.push(new Particle(px.sx,px.sy,px.r,px.g,px.b,px.a,px.normY));
  }

  // Erase wheel canvas rows in sync with particle delay
  // Each row erased when its particles start moving (~delay frames at 60fps)
  const W=wheelCanvas.width, H=wheelCanvas.height;
  const totalFrames=100; // matches max delay
  let frame=0;
  function eraseFrame(){
    const progress=frame/totalFrames;
    const eraseUpToY=Math.floor(progress*H);
    wCtx.clearRect(0,0,W,eraseUpToY+4); // +4 px feather
    frame++;
    if(frame<=totalFrames) requestAnimationFrame(eraseFrame);
    else wCtx.clearRect(0,0,W,H);
  }
  requestAnimationFrame(eraseFrame);
  runParticles();
}

// ─── Gather particles into text ───────────────────────────────────────────────
function gatherToText(label, textCX, textCY){
  const targets=buildTextTargets(label, textCX, textCY);
  if(!targets.length) return;
  targets.sort(()=>Math.random()-0.5);

  // Assign falling particles to letter targets
  let assigned=0;
  for(const p of particles){
    if(assigned>=targets.length){p.alpha=0;continue;}
    p.tx=targets[assigned].x;
    p.ty=targets[assigned].y;
    p.phase="gather";
    p.delay=0; p.vx=0; p.vy=0;
    assigned++;
  }

  // Spawn extra particles for any remaining targets
  for(let i=assigned;i<targets.length;i++){
    const ep=new Particle(
      textCX+(Math.random()-0.5)*300,
      textCY-30+Math.random()*60,
      255,255,255,0.05,1
    );
    ep.phase="gather";
    ep.tx=targets[i].x; ep.ty=targets[i].y;
    ep.delay=0; ep.vx=0; ep.vy=0; ep.size=1.2;
    particles.push(ep);
  }
}

// ─── Spin logic ───────────────────────────────────────────────────────────────
function spinTo(idx, onDone){
  if(isSpinning) return;
  isSpinning=true;
  if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}
  particles=[];
  if(particleAnimId){cancelAnimationFrame(particleAnimId);particleAnimId=null;}
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);

  const arcs=getArcs();
  let ss=0;
  for(let i=0;i<idx;i++) ss+=arcs[i];
  const sm=ss+arcs[idx]/2;
  const target=Math.PI/2-sm+Math.PI;
  const norm=currentAngle%(Math.PI*2);
  let diff=target-norm;
  while(diff<0) diff+=Math.PI*2;

  const finalAngle=currentAngle+diff+(6+Math.floor(Math.random()*3))*Math.PI*2;
  const dur=4500, t0=performance.now(), a0=currentAngle;
  lastArrowSector=-1;

  function frame(now){
    const prog=Math.min((now-t0)/dur,1);
    const ease=1-Math.pow(1-prog,4);
    currentAngle=a0+(finalAngle-a0)*ease;
    const sec=getSectorUnderArrow(currentAngle);
    drawWheel(currentAngle,sec);
    if(sec!==lastArrowSector){if(lastArrowSector!==-1)kickArrow();lastArrowSector=sec;}
    if(prog<1){requestAnimationFrame(frame);return;}

    // Spin done
    isSpinning=false;
    drawWheel(currentAngle,idx);
    db.ref("history").push({value:options[idx].label,time:Date.now()});

    setTimeout(()=>{
      const rect=wheelCanvas.getBoundingClientRect();
      const wCx=rect.left+rect.width/2;
      const wCy=rect.top+rect.height/2;
      const rzRect=resultZone.getBoundingClientRect();
      const textCX=pCanvas.width/2;
      const textCY=rzRect.top+rzRect.height/2;

      // Dissolve wheel into sand
      startDissolve(wCx, wCy);

      // After 2s redirect particles into text
      setTimeout(()=>{
        gatherToText(options[idx].label, textCX, textCY);
      }, 2000);

      // Clean up after 9s, hide wheel
      hideTimer=setTimeout(()=>{
        particles=[];
        if(particleAnimId) cancelAnimationFrame(particleAnimId);
        pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
        wheelWrap.classList.remove("visible");
        drawWheel(currentAngle);
        if(onDone) onDone();
      }, 9000);

    }, 1200);
  }
  requestAnimationFrame(frame);
}

// ─── Queue ────────────────────────────────────────────────────────────────────
function processQueue(){
  if(processingQueue||!spinQueue.length) return;
  processingQueue=true;
  const idx=spinQueue.shift();
  wheelWrap.classList.add("visible");
  spinTo(idx,()=>{
    processingQueue=false;
    if(spinQueue.length) setTimeout(processQueue,600);
  });
}

// ─── Firebase ─────────────────────────────────────────────────────────────────
drawWheel(0);

db.ref("options").on("value", snap=>{
  if(snap.val()){options=snap.val(); drawWheel(currentAngle);}
});
db.ref("goal").on("value", snap=>{
  if(snap.val()) goal=snap.val();
});

let lastTs=0;
db.ref("spinCommand").on("value", snap=>{
  const data=snap.val();
  if(!data||data.ts===lastTs) return;
  lastTs=data.ts;
  const idx=options.findIndex(o=>o.label===data.label);
  if(idx!==-1) setTimeout(()=>{spinQueue.push(idx);processQueue();}, isSpinning?0:10000);
});

db.ref("donateTotal").on("value", snap=>{
  const total=snap.val()||0;
  scaleLabel.innerText=`Колесо ${total}/${goal}`;
  scaleWrap.classList.add("visible");
});
</script>
</body>
</html>
